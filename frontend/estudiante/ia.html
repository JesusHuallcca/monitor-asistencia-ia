<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Senati | Asistente IA</title>
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body class="admin-page" data-rol="estudiante">
    <div class="admin-layout">
      <aside class="admin-menu"></aside>

      <div class="admin-principal">
        <header class="admin-cabecera">
          <div>
            <h1>Asistente IA</h1>
            <p class="subtitulo-pagina">
              Consulta tus datos con lenguaje natural.
            </p>
          </div>
        </header>

        <main class="admin-cuerpo">
          <!--
          ============================================================
          ESPACIO RESERVADO PARA EL CHATBOT (Persona 4)
          Aquí va la interfaz del chat conectada a chatbot_service.py.
          Requisitos:
            - Usar el token de la sesión: Auth.fetchAutenticado("/api/chatbot/...")
            - El backend debe aplicar permisos: el estudiante solo consulta SUS datos.
          Detalle en docs/integracion-dashboards.md
          ============================================================
        -->
          <section
            id="zona-chatbot"
            class="panel-card zona-integracion"
            data-integracion="chatbot"
          >
            <div class="vacio-bloque">
              <strong>Asistente con IA</strong>
              Este espacio estará disponible próximamente.
            </div>
          </section>
        </main>
      </div>
    </div>

    <div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>

    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin-comun.js"></script>
    <script src="../js/panel-comun.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () =>
        Panel.iniciar(document.body.dataset.rol),
      );
    </script>
  </body>
</html>
