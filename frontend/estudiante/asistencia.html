<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Asistencia | Monitor IA</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #123b63;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            width: 100%;
            padding: 26px;
            text-align: center;
            border-bottom: 2px solid #e5edf5;
        }

        .header-title {
            color: #0b5cab;
            font-size: 28px;
            font-weight: 800;
        }

        .main {
            width: min(900px, 92%);
            flex: 1;
            margin: auto;
            padding: 35px 0 45px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .title {
            color: #123b63;
            font-size: 34px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #54718c;
            font-size: 17px;
            text-align: center;
            margin-bottom: 28px;
        }

        .camera-container {
            width: min(760px, 100%);
            aspect-ratio: 16 / 9;

            position: relative;
            overflow: hidden;

            background: #eef5fb;
            border: 4px solid #0b5cab;
            border-radius: 20px;

            box-shadow:
                0 12px 35px rgba(11, 92, 171, 0.12);
        }

        #camera {
            width: 100%;
            height: 100%;
            object-fit: cover;

            display: block;

            transform: scaleX(-1);
        }

        .camera-label {
            position: absolute;

            top: 18px;
            left: 18px;

            padding: 9px 16px;

            background: #ffffff;
            color: #0b5cab;

            border: 1px solid #d7e6f3;
            border-radius: 20px;

            font-size: 14px;
            font-weight: 700;
        }

        .status-container {
            width: 100%;
            margin-top: 28px;
            text-align: center;
            min-height: 100px;
        }

        .status {
            color: #0b5cab;
            font-size: 27px;
            font-weight: 800;
        }

        .status-detail {
            margin-top: 10px;

            color: #54718c;
            font-size: 17px;
        }

        .result-box {
            width: 100%;
            display: none;

            flex-direction: column;
            align-items: center;

            text-align: center;
            margin-top: 25px;
        }

        .result-title {
            color: #0b5cab;
            font-size: 28px;
            font-weight: 800;
        }

        .student-name {
            margin-top: 10px;

            color: #123b63;
            font-size: 38px;
            font-weight: 800;
        }

        .result-time {
            margin-top: 8px;

            color: #54718c;
            font-size: 18px;
        }

        .ok-button {
            margin-top: 25px;

            width: 180px;
            height: 55px;

            border: none;
            border-radius: 10px;

            background: #0b5cab;
            color: #ffffff;

            font-size: 19px;
            font-weight: 800;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .ok-button:hover {
            background: #084b8c;
            transform: translateY(-1px);
        }

        .ok-button:active {
            transform: translateY(0);
        }

        .footer {
            width: 100%;
            padding: 14px;

            border-top: 1px solid #e5edf5;

            text-align: center;

            color: #6c8499;
            font-size: 13px;
        }

        @media (max-width: 700px) {

            .header-title {
                font-size: 22px;
            }

            .title {
                font-size: 27px;
            }

            .camera-container {
                border-width: 3px;
                border-radius: 14px;
            }

            .status {
                font-size: 22px;
            }

            .student-name {
                font-size: 30px;
            }

            .ok-button {
                width: 160px;
            }
        }

    </style>

</head>


<body>

    <div class="page">


        <header class="header">

            <div class="header-title">
                MONITOR DE ASISTENCIA IA
            </div>

        </header>


        <main class="main">


            <h1 class="title">
                REGISTRA TU ASISTENCIA
            </h1>


            <p class="subtitle">
                Acércate a la cámara. El registro es automático.
            </p>


            <div class="camera-container">

                <video
                    id="camera"
                    autoplay
                    muted
                    playsinline
                ></video>

                <div class="camera-label">
                    CÁMARA ACTIVA
                </div>

            </div>


            <div
                id="statusContainer"
                class="status-container"
            >

                <div
                    id="status"
                    class="status"
                >
                    ACÉRCATE A LA CÁMARA
                </div>

                <div
                    id="statusDetail"
                    class="status-detail"
                >
                    Esperando estudiante...
                </div>

            </div>


            <div
                id="resultBox"
                class="result-box"
            >

                <div
                    id="resultTitle"
                    class="result-title"
                >
                    ASISTENCIA REGISTRADA
                </div>


                <div
                    id="studentName"
                    class="student-name"
                >
                    Estudiante
                </div>


                <div
                    id="resultTime"
                    class="result-time"
                >
                    --
                </div>


                <button
                    id="okButton"
                    class="ok-button"
                >
                    OK
                </button>

            </div>


        </main>


        <footer class="footer">

            Sistema inteligente de asistencia facial

        </footer>


    </div>


    <script src="../components/camera.js"></script>


    <script>

        const video =
            document.getElementById("camera");


        const statusContainer =
            document.getElementById(
                "statusContainer"
            );


        const status =
            document.getElementById("status");


        const statusDetail =
            document.getElementById(
                "statusDetail"
            );


        const resultBox =
            document.getElementById("resultBox");


        const resultTitle =
            document.getElementById(
                "resultTitle"
            );


        const studentName =
            document.getElementById(
                "studentName"
            );


        const resultTime =
            document.getElementById(
                "resultTime"
            );


        const okButton =
            document.getElementById(
                "okButton"
            );


        function showStatus(
            message,
            detail = ""
        ) {

            statusContainer.style.display =
                "block";

            resultBox.style.display =
                "none";

            status.textContent =
                message;

            statusDetail.textContent =
                detail;
        }


        function showRegistered(data) {

            statusContainer.style.display =
                "none";

            resultBox.style.display =
                "flex";

            resultTitle.textContent =
                "ASISTENCIA REGISTRADA";


            const name =
                data.attendance?.student_name ||
                data.student_name ||
                data.person_id ||
                "Estudiante";


            studentName.textContent =
                name;


            const now =
                new Date();


            resultTime.textContent =
                `Hora: ${now.toLocaleTimeString("es-PE")}`;
        }


        function showAlreadyRegistered(data) {

            statusContainer.style.display =
                "none";

            resultBox.style.display =
                "flex";


            resultTitle.textContent =
                "ASISTENCIA YA REGISTRADA";


            const name =
                data.attendance?.student_name ||
                data.student_name ||
                data.person_id ||
                "Estudiante";


            studentName.textContent =
                name;


            const now =
                new Date();


            resultTime.textContent =
                `Hora: ${now.toLocaleTimeString("es-PE")}`;
        }


        const camera =
            new AttendanceCamera(
                video,
                {

                    onStatus: (data) => {

                        if (
                            data.status ===
                            "WAITING"
                        ) {

                            showStatus(
                                "ACÉRCATE A LA CÁMARA",
                                data.message
                            );

                        }


                        else if (
                            data.status ===
                            "VERIFYING"
                        ) {

                            showStatus(
                                "VERIFICANDO...",
                                data.message
                            );

                        }


                        else if (
                            data.status ===
                            "ERROR"
                        ) {

                            showStatus(
                                data.message,
                                "Por favor, inténtalo nuevamente."
                            );

                        }

                    },


                    onSuccess: (data) => {

                        showRegistered(data);

                    },


                    onAlreadyRegistered:
                        (data) => {

                            showAlreadyRegistered(
                                data
                            );

                        },


                    onError: (message) => {

                        showStatus(
                            "CÁMARA NO DISPONIBLE",
                            message
                        );

                    }

                }
            );


        okButton.addEventListener(
            "click",
            async () => {

                resultBox.style.display =
                    "none";

                statusContainer.style.display =
                    "block";

                showStatus(
                    "ACÉRCATE A LA CÁMARA",
                    "Esperando estudiante..."
                );

                await camera.restart();

            }
        );


        camera.start();

    </script>

</body>

</html>
