<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Senati | Usuarios</title>
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/rostro.css" />
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body class="admin-page">
    <div class="admin-layout">
      <aside class="admin-menu">
        <div class="admin-marca">
          <img src="../assets/img/senati.png" alt="Senati" />
        </div>
        <nav aria-label="Administración">
          <a class="activo" href="usuarios.html">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2" />
              <circle cx="10" cy="7" r="4" />
              <path d="M21 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            Usuarios
            <span id="contador-pendientes" class="contador" hidden></span>
          </a>
          <a href="cursos.html">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
              <path
                d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"
              />
            </svg>
            Cursos
          </a>
          <span class="pronto">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            </svg>
            Auditoría
          </span>
        </nav>
        <div class="admin-pie">
          <div class="quien-menu">
            <strong id="nombre-admin"></strong><span id="rol-admin"></span>
          </div>
          <button type="button" id="btn-salir" class="btn-salir">
            Cerrar sesión
          </button>
        </div>
      </aside>

      <div class="admin-principal">
        <
        <header class="admin-cabecera">
          <div>
            <h1>Usuarios</h1>
            <p class="subtitulo-pagina">
              Gestiona cuentas, roles y aprobaciones.
            </p>
          </div>
          <button type="button" id="btn-nuevo" class="btn-principal btn-nuevo">
            + Nuevo usuario
          </button>
        </header>

        <main class="admin-cuerpo">
          <section class="stats" aria-label="Resumen (haz clic para filtrar)">
            <button type="button" class="stat" data-rol="" data-estado="">
              <span class="ico"
                ><svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2" />
                  <circle cx="10" cy="7" r="4" />
                  <path
                    d="M21 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"
                  /></svg
              ></span>
              <span
                ><span class="num" id="st-total">–</span
                ><span class="rot">Usuarios</span></span
              >
            </button>
            <button
              type="button"
              class="stat teal"
              data-rol="profesor"
              data-estado=""
            >
              <span class="ico"
                ><svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                  <circle cx="9" cy="7" r="4" />
                  <polyline points="16 11 18 13 22 9" /></svg
              ></span>
              <span
                ><span class="num" id="st-prof">–</span
                ><span class="rot">Profesores</span></span
              >
            </button>
            <button
              type="button"
              class="stat violeta"
              data-rol="estudiante"
              data-estado=""
            >
              <span class="ico"
                ><svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
                  <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" /></svg
              ></span>
              <span
                ><span class="num" id="st-est">–</span
                ><span class="rot">Estudiantes</span></span
              >
            </button>
            <button
              type="button"
              class="stat ambar"
              data-rol=""
              data-estado="pendiente"
            >
              <span class="ico"
                ><svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="12" cy="12" r="10" />
                  <polyline points="12 6 12 12 16 14" /></svg
              ></span>
              <span
                ><span class="num" id="st-pend">–</span
                ><span class="rot">Pendientes de aprobar</span></span
              >
            </button>
          </section>

          <div class="filtros">
            <input
              type="text"
              id="filtro-q"
              placeholder="Busque por nombre, usuario o correo"
              maxlength="50"
            />
            <select id="filtro-rol" aria-label="Filtrar por rol">
              <option value="">Todos los roles</option>
              <option value="admin">Administrador</option>
              <option value="profesor">Profesor</option>
              <option value="estudiante">Estudiante</option>
            </select>
            <select id="filtro-estado" aria-label="Filtrar por estado">
              <option value="">Todos los estados</option>
              <option value="pendiente">Pendiente</option>
              <option value="activo">Activo</option>
              <option value="inactivo">Inactivo</option>
            </select>
          </div>

          <p id="conteo" class="conteo"></p>
          <div class="tabla-caja">
            <table class="tabla">
              <thead>
                <tr>
                  <th>Persona</th>
                  <th>Correo</th>
                  <th>Rol</th>
                  <th>Estado</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="tabla-cuerpo">
                <tr>
                  <td class="vacio" colspan="5">Cargando…</td>
                </tr>
              </tbody>
            </table>
          </div>
        </main>
      </div>
    </div>

    <!-- Ventana: nuevo usuario -->
    <dialog
      id="modal-nuevo"
      class="modal modal-ancho"
      aria-labelledby="titulo-nuevo"
    >
      <div class="modal-contenido">
        <h2 id="titulo-nuevo">Nuevo usuario</h2>
        <form id="form-nuevo" novalidate>
          <p id="mensaje-nuevo" class="mensaje-error" role="alert"></p>

          <div class="campo">
            <label for="n-rol">Rol</label>
            <select id="n-rol">
              <option value="estudiante">Estudiante</option>
              <option value="profesor">Profesor</option>
              <option value="admin">Administrador</option>
            </select>
          </div>

          <div class="fila">
            <div class="campo">
              <label for="n-nombres">Nombres</label
              ><input type="text" id="n-nombres" maxlength="100" />
            </div>
            <div class="campo">
              <label for="n-apellidos">Apellidos</label
              ><input type="text" id="n-apellidos" maxlength="100" />
            </div>
          </div>

          <div class="fila">
            <div class="campo">
              <label for="n-username">Usuario</label
              ><input type="text" id="n-username" maxlength="50" />
            </div>
            <div class="campo">
              <label for="n-email">Correo</label
              ><input
                type="text"
                id="n-email"
                inputmode="email"
                maxlength="120"
              />
            </div>
          </div>

          <div class="campo">
            <label for="n-password">Contraseña inicial</label>
            <div class="fila-clave">
              <input
                type="text"
                id="n-password"
                maxlength="128"
                autocomplete="off"
              />
              <button type="button" id="btn-generar" class="btn-mini">
                Generar
              </button>
            </div>
          </div>

          <div id="campos-estudiante" class="fila">
            <div class="campo">
              <label for="n-carrera">Carrera</label
              ><input type="text" id="n-carrera" maxlength="120" />
            </div>
            <div class="campo">
              <label for="n-ciclo">Ciclo</label
              ><input
                type="text"
                id="n-ciclo"
                inputmode="numeric"
                maxlength="2"
              />
            </div>
          </div>

          <div id="campos-profesor" class="campo" hidden>
            <label for="n-especialidad">Especialidad</label>
            <input type="text" id="n-especialidad" maxlength="120" />
          </div>

          <div class="modal-acciones">
            <button
              type="button"
              id="btn-cancelar-nuevo"
              class="btn-secundario"
            >
              Cancelar
            </button>
            <button type="submit" id="btn-guardar-nuevo" class="btn-principal">
              Crear usuario
            </button>
          </div>
        </form>
      </div>
    </dialog>

    <div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>

    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin-comun.js"></script>
    <script src="../js/admin-usuarios.js"></script>
  </body>
</html>
